<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Placeholder avatar">
  <title>Linkfile demo avatar</title>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="55%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="figure" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.72" />
    </linearGradient>
    <clipPath id="frame">
      <circle cx="128" cy="128" r="128" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="256" height="256" fill="url(#backdrop)" />

    <!-- Faint grid, echoing the page background texture. -->
    <g stroke="#ffffff" stroke-opacity="0.09" stroke-width="1">
      <path d="M32 0V256M64 0V256M96 0V256M128 0V256M160 0V256M192 0V256M224 0V256" />
      <path d="M0 32H256M0 64H256M0 96H256M0 128H256M0 160H256M0 192H256M0 224H256" />
    </g>

    <circle cx="196" cy="52" r="86" fill="#ffffff" fill-opacity="0.10" />

    <!-- Simple abstract portrait: head and shoulders. -->
    <circle cx="128" cy="104" r="40" fill="url(#figure)" />
    <path d="M40 244c0-46 39-78 88-78s88 32 88 78z" fill="url(#figure)" />
  </g>

  <circle cx="128" cy="128" r="127" fill="none" stroke="#000000" stroke-opacity="0.12" stroke-width="2" />
</svg>
