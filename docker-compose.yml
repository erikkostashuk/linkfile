services:
  linkfile:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    image: linkfile
    container_name: linkfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      CLICK_STORE: file
      CLICK_LOG_PATH: /app/.data/clicks.log
      STATS_USERNAME: ${STATS_USERNAME:-}
      STATS_PASSWORD: ${STATS_PASSWORD:-}
    volumes:
      - linkfile-data:/app/.data

volumes:
  linkfile-data:
