<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Placeholder avatar">
  <title>Linkfile demo avatar</title>
  <!--
    Neutral placeholder. Replace this file with your own picture — any web image
    format works, just point profile.avatar at it in links.json.

    The styles below make the placeholder follow the viewer's colour scheme, so
    it sits quietly on the page in both themes instead of glaring in dark mode.
    Browsers that ignore media queries inside an <img> simply get the light
    version, which is a perfectly good fallback.
  -->
  <style>
    .backdrop { fill: #ececee; }
    .figure   { fill: #a8a8b0; }
    .ring     { stroke: #000000; stroke-opacity: 0.08; }

    @media (prefers-color-scheme: dark) {
      .backdrop { fill: #1c1c20; }
      .figure   { fill: #55555e; }
      .ring     { stroke: #ffffff; stroke-opacity: 0.10; }
    }
  </style>

  <defs>
    <clipPath id="frame">
      <circle cx="128" cy="128" r="128" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect class="backdrop" width="256" height="256" />
    <circle class="figure" cx="128" cy="103" r="38" />
    <path class="figure" d="M42 246c0-45 38.5-76 86-76s86 31 86 76z" />
  </g>

  <circle class="ring" cx="128" cy="128" r="127.5" fill="none" />
</svg>
